[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conlang"
version = "0.1.0"
description = "自分専用の人工言語創作アプリ(辞書・文法・造語支援)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "pytest-qt>=4"]

[project.scripts]
conlang = "conlang.cli:main"

[project.gui-scripts]
conlang-gui = "conlang.gui.app:main"

[tool.setuptools.packages.find]
include = ["conlang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
